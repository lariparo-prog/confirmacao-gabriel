<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abertura Gabriel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    width:100vw;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

#poster{
    width:100%;
    height:100%;
    object-fit:contain;
    cursor:pointer;
}

#video{
    width:100%;
    height:100%;
    object-fit:contain;
    display:none;
}

#pular{
    position:fixed;
    top:20px;
    right:20px;
    background:rgba(0,0,0,0.7);
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:30px;
    font-size:16px;
    z-index:999;
    display:none;
}
</style>
</head>

<body>

<img id="poster" src="poster.jpeg">

<video id="video" playsinline>
    <source src="abertura.mp4" type="video/mp4">
</video>

<button id="pular">⏭️ Pular abertura</button>

<script>

const poster = document.getElementById("poster");
const video = document.getElementById("video");
const pular = document.getElementById("pular");

function abrirVideo(){

    poster.style.display = "none";

    video.style.display = "block";

    pular.style.display = "block";

    video.play();
}

function irParaConvite(){
    window.location.href = "convite.html";
}

poster.addEventListener("click", abrirVideo);

pular.addEventListener("click", irParaConvite);

video.addEventListener("ended", irParaConvite);

</script>

</body>
</html>
