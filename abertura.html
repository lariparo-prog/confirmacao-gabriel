<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abertura Gabriel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    height:100vh;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

#pular{
    position:fixed;
    top:20px;
    right:20px;
    background:rgba(0,0,0,0.6);
    color:#fff;
    border:none;
    padding:12px 18px;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    z-index:999;
}
</style>
</head>

<body>

<button id="pular">⏭️ Pular abertura</button>

<video id="video" autoplay muted playsinline>
    <source src="abertura.mp4" type="video/mp4">
</video>

<script>
function irParaConvite(){
    window.location.href = "confirmacao.html";
}

document.getElementById("pular").onclick = irParaConvite;

setTimeout(function(){
    document.getElementById("pular").style.display = "none";
}, 6000);

document.getElementById("video").addEventListener("ended", function(){
    irParaConvite();
});
</script>

</body>
</html>
