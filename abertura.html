<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abertura Gabriel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#poster{
    width:100%;
    height:100%;
    object-fit:cover;
    cursor:pointer;
    display:block;
}

#textoToque{
    position:fixed;
    bottom:95px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.65);
    color:white;
    padding:12px 22px;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    z-index:10;
    white-space:nowrap;
}

#video{
    width:100%;
    height:100%;
    object-fit:contain;
    display:none;
}

#pular{
    position:fixed;
    top:20px;
    right:20px;
    background:rgba(0,0,0,0.7);
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:30px;
    font-size:16px;
    z-index:999;
    display:none;
}
</style>
</head>

<body>

<img id="poster" src="poster.jpeg">

<div id="textoToque">⚽ Toque no selo para abrir</div>

<video id="video" playsinline>
    <source src="abertura.mp4" type="video/mp4">
</video>

<button id="pular">⏭️ Pular abertura</button>

<script>
const poster = document.getElementById("poster");
const textoToque = document.getElementById("textoToque");
const video = document.getElementById("video");
const pular = document.getElementById("pular");

function abrirVideo(){
    poster.style.display = "none";
    textoToque.style.display = "none";
    video.style.display = "block";
    pular.style.display = "block";
    video.play();
}

function irParaConvite(){
    window.location.href = "convite.html";
}

poster.addEventListener("click", abrirVideo);
textoToque.addEventListener("click", abrirVideo);
pular.addEventListener("click", irParaConvite);
video.addEventListener("ended", irParaConvite);
</script>

</body>
</html>
